<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ebbe Stankiewicz"/>
    <meta name="description" content="The Add School page for Edugate. Edugate is a result management system for high schools in Nigeria."/>
    <link rel="stylesheet" href="#"/>
    <script src="#" defer></script>
    <title>Edugate | Add School</title>
</head>
<body>
    <header></header>
    <main>
        <section>
            <h1>Add School</h1>
            <p>To add a school, upload an Excel spreadsheet with this format:</p>
        </section>
        <section>
            <table border="1">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>A</th>
                        <th>B</th>
                        <th>C</th>
                        <th>D</th>
                        <th>E</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="col">1</th>
                        <th scope="col">school_name</th>
                        <th scope="col">city</th>
                        <th scope="col">postcode</th>
                        <th scope="col">address_1</th>
                        <th scope="col">contact</th>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>School name</td>
                        <td>City</td>
                        <td>Postcode</td>
                        <td>Address</td>
                        <td>Number</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>#</td>
                        <td>#</td>
                        <td>#</td>
                        <td>#</td>
                        <td>#</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>#</td>
                        <td>#</td>
                        <td>#</td>
                        <td>#</td>
                        <td>#</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <section>
            <button type="button" class="upload-button">Upload</button>
            <button type="button" class="back2dashb-button">Back to dashboard</button>
        </section>
    </main>
</body>
</html>
