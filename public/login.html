<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ingelinn Hallseth" />
    <meta
      name="description"
      content="The Log In page for Edugate. Edugate is a result management system for high schools in Nigeria."
    />
    <link rel="stylesheet" href="style.css" />
    <script src="" defer></script>
    <title>Edugate | Log In</title>
  </head>
  <body>
    <header></header>
    <main>
      <form class="login-form" action="submit-form-here" method="post">
        <h1>Log in</h1>
        <label for="email">Email</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="example@mail.com"
          required
        />
        <label for="password">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Enter password"
          required
        />
        <small>Forgot your password? Click <a href="#">here</a>.</small>
        <button type="submit" class="submit-button">Submit</button>
      </form>
    </main>
    <footer></footer>
  </body>
</html>
