<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ingelinn Hallseth" />
    <meta
      name="description"
      content="The Sign Up page for Edugate. Edugate is a result management system for high schools in Nigeria."
    />
    <link rel="stylesheet" href="" />
    <script src="" defer></script>
    <title>Edugate | Sign Up</title>
  </head>
  <body>
    <header></header>
    <main>
      <form class="signup-form" action="submit-form-here" method="post">
        <h1>Sign Up</h1>
        <label for="email">Email</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="example@mail.com"
          required
        />
        <label for="firstname">Firstname</label>
        <input
          type="text"
          name="firstname"
          id="firstname"
          placeholder="Ola"
          required
        />
        <label for="surname">Surname</label>
        <input
          type="text"
          name="surname"
          id="surname"
          placeholder="Nordmann"
          required
        />
        <label for="password">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Choose password"
          required
        />
        <label for="confirm-password">Confirm password</label>
        <input
          type="password"
          name="confirm-password"
          id="confirm-password"
          placeholder="Repeat password"
          required
        />
        <button type="submit" class="submit-button">Submit</button>
      </form>
    </main>
    <footer></footer>
  </body>
</html>
