<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="A page for editing teacher profile information" />
        <link rel="stylesheet" href="css/styles.css" />
		<title>Edit Profile - Teacher</title>
	</head>
	<body>
        <!--header to be coded-->
		<header>
			<h1>Edugate</h1>
			<nav>
				<ul>
					<li><a href="">Dashboard</a></li>
					<li><a href="">About</a></li>
					<li><a href="">Contact</a></li>
				</ul>
			</nav>
		</header>

		<main>
			<h1>Edit Teacher Profile</h1>

			<!-- Avatar Section -->
			<div>
				<!-- Avatar Placeholder to be coded  -->
				<div>
					JB
				</div>
			</div>

			<!-- Form Section to be codded-->
			<section>
				<form action="" method="post">
					<!-- Editable Fields -->
					<div>
						<label for="name">Name:</label>
						<input type="text" id="name" name="name" placeholder="Enter teacher's name" />
					</div>
					<div>
						<label for="email">Email:</label>
						<input type="email" id="email" name="email" placeholder="Enter teacher's email" />
					</div>
					<div>
						<label for="dob">Date of Birth:</label>
						<input type="date" id="dob" name="dob" />
					</div>

					<!-- Read-Only Fields -->
					<div>
						<label for="id">ID:</label>
						<input type="text" id="id" name="id" value="1921840" readonly />
					</div>
					<div>
						<label for="position">Position:</label>
						<input type="text" id="position" name="position" value="Teacher" readonly />
					</div>
					<div>
						<label for="school">School:</label>
						<input type="text" id="school" name="school" value="The Academy" readonly />
					</div>

					<!-- Submit Button -->
					<div>
						<button type="submit">Update</button>
					</div>
				</form>
			</section>
		</main>

		<footer>
			<p>&copy; 2025 Edugate. All Rights Reserved.</p>
		</footer>
	</body>
</html>
