<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage student user</title>
</head>
    <body class="bg-gray-100 p-6">
        <div id="admin-panel" class="max-w-4xl mx-auto bg-white p-8 shadow-lg rounded-lg">
            <h1 class="text-2xl font-bold text-gray-700 mb-6">Manage Student Information</h1>
    
            <form id="student-info-form" class="space-y-4">
                <div class="form-group">
                    <label for="student-id" class="block text-sm font-medium text-gray-700">ID:</label>
                    <input type="text" id="student-id" name="student-id" placeholder="1921840" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
    
                <div class="form-group">
                    <label for="student-first-name" class="block text-sm font-medium text-gray-700">First Name:</label>
                    <input type="text" id="student-first-name" name="student-first-name" placeholder="Joe" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
    
                <div class="form-group">
                    <label for="student-last-name" class="block text-sm font-medium text-gray-700">Last Name:</label>
                    <input type="text" id="student-last-name" name="student-last-name" placeholder="Bloggs" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
    
                <div class="form-group">
                    <label for="grade-year" class="block text-sm font-medium text-gray-700">Grade Year:</label>
                    <input type="text" id="grade-year" name="grade-year" placeholder="2020" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
    
                <div class="form-group">
                    <label for="position" class="block text-sm font-medium text-gray-700">Position:</label>
                    <input type="text" id="position" name="position" placeholder="Student" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
    
                <div class="form-group">
                    <label for="date-of-birth" class="block text-sm font-medium text-gray-700">Date of Birth:</label>
                    <input type="text" id="date-of-birth" name="date-of-birth" placeholder="01/01/2002" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
    
                <div class="form-group">
                    <label for="student-email" class="block text-sm font-medium text-gray-700">Email:</label>
                    <input type="email" id="student-email" name="student-email" placeholder="joeblog2020@edugate.no" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
    
                <div class="flex space-x-4">
                    <button type="button" id="update-button" 
                        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md shadow">Update</button>
                    <button type="button" id="delete-button" 
                        class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md shadow">Delete</button>
                </div>
            </form>
    
            <!--  delete confirmation -->
            <div id="delete-modal" class="hidden fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center">
                <div class="bg-white p-6 rounded-lg shadow-lg max-w-sm w-full">
                    <p class="text-lg text-gray-700 mb-4">Are you sure you want to delete this student?</p>
                    <div class="flex justify-end space-x-4">
                        <button type="button" id="confirm-delete" 
                            class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md">Yes, Delete</button>
                        <button type="button" id="cancel-delete" 
                            class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-md">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    
    
</body>
</html>
