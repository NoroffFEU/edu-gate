<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin profile page for Edugate webpage.">
    <link rel="stylesheet" href="../dist/output.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>Admin Profile Page</title>
</head>
<body>
<!--header is removed and being replaced-->
    <main>
        <div class="flex flex-col lg:flex-row">
            <!--Sidebar-->
            <div id="sidebar" class="hidden lg:flex flex-col gap-12 ml-4">
                <img class="cursor-pointer w-12" src="/public/icons/dashboard.png" alt="Picutre of a green home icon">
                <img class="cursor-pointer w-12" src="/public/icons/results.png" alt="Picture of a green results icon">
                <img class="cursor-pointer w-12" src="/public/icons/user-circle.png" alt="Picture of a green user icon">
                <img class="cursor-pointer w-12" src="/public/icons/school-management.png" alt="Picture of a green school icon">
                <img class="cursor-pointer w-12" src="/public/icons/logout.png" alt="Picture of a red log out icon">
            </div>

            <!--Mobile view-->
            <div class="md:hidden grid gap-4 justify-items-center text-center">
                <h1 class="font-extrabold">Dashboard</h1>
                <img src="../public/img/Student initials mobile.png" alt="Picture of a green circle with the initials JB">
                <h2 class="font-bold">Joe Bloggs</h2>
                <h3>Admin at Edugate School</h3>
                <img src="/public/icons/add-user.png" alt="Picture of a green profile icon">
                <h4>Manage user</h4>
                <img src="/public/icons/add-student.png" alt="Picture of a green student icon">
                <h4>Add student</h4>
                <img src="/public/icons/add-teacher.png" alt="Picture of a green teacher icon with an add button">
                <h4>Add teacher</h4>
                <img src="/public/icons/add-school.png" alt="Picture of a green school icon">
                <h4>Add school</h4>
                <img src="/public/icons/logout.png" alt="Picture of a red log out icon">
                <h4>Log out</h4>
            </div>

            <!--Desktop view-->
            <div class="lg: hidden grid-cols-1 place-items-center gap-4 w-full">
                <h1 class="font-extrabold">Dashboard</h1>
                <img src="../public/img/Student initials.png" alt="Picture of a green circle with the initials JB.">
                <h2 class="font-bold">Joe Bloggs</h2>
                <h3>Admin at Edugate School</h3>
                <div class="grid grid-cols-3 gap-20 m-4">
                    <div>
                        <img class="cursor-pointer" src="/public/icons/add-user.png" alt="Picture of a green user icon with an edit icon">
                        <h4>Manage users</h4>
                    </div>
                    <div>
                        <img class="cursor-pointer" src="/public/icons/add-student.png" alt="Picture of a green student icon with an add button">
                        <h4>Add student</h4>
                    </div>
                    <div>
                        <img class="cursor-pointer" src="/public/icons/add-school.png" alt="Picture of a green school icon with an add button">
                        <h4>Add school</h4>
                    </div>
                    <div>
                        <img class="cursor-pointer" src="/public/icons/add-teacher.png" alt="Picture of a green teacher icon with an add button">
                        <h4>Add teacher</h4>
                    </div>
                    <div>
                        <img class="cursor-pointer" src="/public/icons/user-circle.png" alt="Picture of a green profile icon">
                        <h4>See profile</h4>
                    </div>
                    <div>
                        <img class="cursor-pointer" src="/public/icons/logout.png" alt="Picture of a red log out icon">
                        <h4>Log out</h4>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-8 w-full flex">
        <img class="w-full max-w-md mx-auto" src="/public/img/circle-footer.png" alt="Picture of a blue circle overlapping a green circle">
    </footer>
</body>
</html>
