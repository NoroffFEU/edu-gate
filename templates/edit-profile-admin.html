<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="A page for editing admin information" />
        <link rel="stylesheet" href="css/style.css" />
		<title>Edit Profile - Admin</title>
	</head>
	<body>
        <!--heade to be coded-->
		<header>
			<h1>Edugate</h1>
			<nav>
				<a href="">Dashboard</a>
				<a href="">About</a>
				<a href="">Contact</a>
			</nav>
		</header>

		<main>
			<h1>Edit Profile</h1>

			<div>
				<!-- Avatar placeholder to be coded-->
				<div style=>
					JB
				</div>
			</div>

			<section>
				<form action="#" method="post">
					<!-- Editable fields -->
					<div>
						<label for="name">Name:</label>
						<input type="text" id="name" name="name" placeholder="Enter your name" />
					</div>
					<div>
						<label for="email">Email:</label>
						<input type="email" id="email" name="email" placeholder="Enter your email" />
					</div>
					<div>
						<label for="dob">Date of Birth:</label>
						<input type="date" id="dob" name="dob" />
					</div>

					<!-- Read-only fields -->
					<div>
						<label for="id">ID:</label>
						<input type="text" id="id" name="id" value="1921840" readonly />
					</div>
					<div>
						<label for="position">Position:</label>
						<input type="text" id="position" name="position" value="Admin" readonly />
					</div>
					<div>
						<label for="school">School:</label>
						<input type="text" id="school" name="school" value="The Academy" readonly />
					</div>

					<!-- Submit button -->
					<div>
						<button type="submit">Update</button>
					</div>
				</form>
			</section>
		</main>

		<footer>
			<p>&copy; 2025 Edugate. All Rights Reserved.</p>
		</footer>
	</body>
</html>
