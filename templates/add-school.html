<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ebbe Stankiewicz" />
    <meta
      name="description"
      content="The Add School page for Edugate. Edugate is a result management system for high schools in Nigeria."
    />
    <title>Edugate | Add School</title>
    <link rel="stylesheet" href="../dist/output.css" />
    <style>
      @media screen and (max-width: 320px) {
        table {
          font-size: 8px;
        }
        th,
        td {
          padding: 0.5rem 0.5rem;
        }
      }
      @media screen and (max-width: 640px) {
        .primary-button,
        .secondary-button {
          padding: 4px 10px;
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <header class="bg-neutral-light-gray text-neutral-dark-gray">
      <nav class="max-w-7x1 flex items-center justify-between px-4">
        <img
          class="pl-5"
          src="../public/img/logo-header.png"
          alt="Edugate Logo"
        />

        <!-- Hamburger Menu -->
        <div class="relative md:hidden">
          <!-- Checkbox for Hamburger Toggle -->
          <input type="checkbox" id="menu-toggle" class="hidden peer" />
          <!-- Hamburger Icon -->
          <label
            for="menu-toggle"
            class="block cursor-pointer focus:outline-none peer-checked:hidden"
            aria-label="Toggle menu"
          >
            <svg
              class="w-14 h-14 mr-4"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16m-7 6h7"
              />
            </svg>
          </label>

          <div
            class="fixed inset-0 bg-white text-neutral-dark-gray z-50 transform translate-x-full peer-checked:translate-x-0 transition-transform duration-300"
          >
            <!-- Close Icon -->
            <label
              for="menu-toggle"
              class="absolute top-4 right-4 cursor-pointer focus:outline-none"
              aria-label="Close menu"
            >
              <svg
                class="w-12 h-12 mt-8"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </label>

            <ul
              class="flex flex-col items-end justify-start mt-40 h-full gap-10 text-xl mr-8"
            >
              <li>
                <a
                  href="#"
                  class="flex items-center gap-5 p-3 border-b-2 border-white hover:border-primary"
                >
                  Login
                  <img
                    class="w-6 h-6"
                    src="../public/icons/login.png"
                    alt="Login Icon"
                  />
                </a>
              </li>
              <li>
                <a
                  href="#"
                  class="flex items-center gap-5 p-3 border-b-2 border-white hover:border-primary"
                >
                  Signup
                  <img
                    class="w-6 h-6"
                    src="../public/icons/signup.png"
                    alt="Signup Icon"
                  />
                </a>
              </li>
              <li>
                <a
                  href="../templates/about.html"
                  class="flex items-center gap-5 p-3 border-b-2 border-white hover:border-primary"
                >
                  About
                  <img
                    class="w-6 h-6"
                    src="../public/icons/about.png"
                    alt="About Icon"
                  />
                </a>
              </li>
              <li>
                <a
                  href="../templates/contact.html"
                  class="flex items-center gap-5 p-3 border-b-2 border-white hover:border-primary"
                >
                  Contact
                  <img
                    class="w-6 h-6"
                    src="../public/icons/contact.png"
                    alt="Contact Icon"
                  />
                </a>
              </li>
            </ul>
          </div>
        </div>

        <ul class="hidden md:flex mr-10 font-Poppins font-medium text-xl">
          <li
            class="py-8 px-16 border-b-2 border-neutral-light-gray hover:border-primary"
          >
            <a href="../templates/about.html" class="font-heading">About</a>
          </li>
          <li
            class="py-8 px-16 border-b-2 border-neutral-light-gray hover:border-primary"
          >
            <a href="../templates/contact.html" class="font-heading">Contact</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="w-full mx-auto p-4 sm:p-6">
      <section class="mb-4 text-sm">
        <nav>
          <a href="#" class="text-gray-500 hover:text-gray-700">Dashboard</a>
          &gt;
          <a href="#" class="text-green-600 font-medium">Add school</a>
        </nav>
      </section>
      <section class="mb-10 text-center">
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Add school</h1>
        <p class="text-gray-600 text-sm sm:text-base mt-4">
          To add a school, upload an Excel spreadsheet with this format:
        </p>
      </section>
      <section class="w-full overflow-hidden">
        <div class="w-full overflow-hidden">
          <table
            class="w-full table-auto border border-gray-300 text-left text-xs sm:text-sm"
          >
            <thead>
              <tr
                class="bg-gray-200 text-gray-600 uppercase text-[10px] sm:text-xs"
              >
                <th class="px-0.5 sm:px-4 py-1">#</th>
                <th
                  class="border border-gray-300 px-0.5 sm:px-4 py-1 text-center"
                >
                  A
                </th>
                <th
                  class="border border-gray-300 px-0.5 sm:px-4 py-1 text-center"
                >
                  B
                </th>
                <th
                  class="border border-gray-300 px-0.5 sm:px-4 py-1 text-center"
                >
                  C
                </th>
                <th
                  class="border border-gray-300 px-0.5 sm:px-4 py-1 text-center"
                >
                  D
                </th>
                <th
                  class="border border-gray-300 px-0.5 sm:px-4 py-1 text-center"
                >
                  E
                </th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td
                  class="bg-gray-200 border border-gray-300 px-0.5 sm:px-4 py-1"
                >
                  1
                </td>
                <td class="border border-gray-300 px-0.5 sm:px-4 py-1">
                  school_name
                </td>
                <td class="border border-gray-300 px-0.5 sm:px-4 py-1">city</td>
                <td class="border border-gray-300 px-0.5 sm:px-4 py-1">
                  postcode
                </td>
                <td class="border border-gray-300 px-0.5 sm:px-4 py-1">
                  address_1
                </td>
                <td class="border border-gray-300 px-0.5 sm:px-4 py-1">
                  contact
                </td>
              </tr>
              <tr>
                <td
                  class="bg-gray-200 border border-gray-300 px-0.5 sm:px-4 py-1"
                >
                  2
                </td>
                <td class="border border-gray-300 px-0.5 sm:px-4 py-1">
                  School name
                </td>
                <td class="border border-gray-300 px-0.5 sm:px-4 py-1">City</td>
                <td class="border border-gray-300 px-0.5 sm:px-4 py-1">
                  Postcode
                </td>
                <td class="border border-gray-300 px-0.5 sm:px-4 py-1">
                  Address
                </td>
                <td class="border border-gray-300 px-0.5 sm:px-4 py-1">
                  Number
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <section class="mt-6 flex flex-col gap-3 items-center">
        <button type="button" class="primary-button py-2 px-6 text-sm">
          Upload +
        </button>
        <button type="button" class="secondary-button py-2 px-6 text-sm">
          Back to dashboard
        </button>
      </section>
    </main>
  </body>
</html>
