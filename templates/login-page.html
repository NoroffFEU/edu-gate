<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ingelinn Hallseth" />
    <meta
      name="description"
      content="The Log In page for Edugate. Edugate is a result management system for high schools in Nigeria."
    />
    <link rel="stylesheet" href="../dist/output.css" />
    <script src="" defer></script>
    <title>Edugate | Log In</title>
  </head>
  <body class="bg-neutral-light-gray font-Roboto">
    <header></header>
    <main>
      <div class="w-full max-w-sm sm:max-w-md mx-auto mt-6 px-4 sm:px-0">
        <form
          class="bg-neutral-light-gray border-0 sm:border-3 sm:border-[#cccccc] shadow-none sm:inset-shadow-sm sm:inset-shadow-[#cccccc] px-10 sm:px-12 pt-6 sm:pt-8 pb-8 sm:pb-10 mb-4"
          action="submit-form-here"
          method="post"
        >
          <h1 class="text-neutral-dark-gray text-center font-Poppins text-[32px] font-bold tracking-wide mb-12 sm:mb-4">Log in</h1>
          <div class="mb-6">
            <label
              class="block text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
              for="email"
              >Email</label
            >
            <input
              class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base"
              type="email"
              name="email"
              id="email"
              placeholder="example@mail.com"
              required
              autocomplete="email"
              inputmode="email"
            />
          </div>
          <div class="mb-6">
            <label
              class="block text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
              for="password"
              >Password</label
            >
            <input
              class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-dark-medium-gray text-sm sm:text-base"
              type="password"
              name="password"
              id="password"
              placeholder="Enter password"
              required
              autocomplete="current-password"
            />
          </div>
          <p
            class="mb-6 text-center text-sm sm:text-base font-light sm:font-normal text-neutral-dark-gray font-Roboto"
          >
            Forgot your password? Click
            <a class="font-bold hover:cursor-pointer" href="#">here</a>.
          </p>
          <div class="text-center mb-4">
            <button type="submit" class="primary-button primary-button:hover">
              Submit
            </button>
          </div>
        </form>
      </div>
    </main>

    <section class="flex justify-start ml-4">
      <div class="bg-[rgba(255,235,238,1)] w-84.25 h-28.5 py-4 px-2 shadow-[-2px_4px_4px_2px_rgba(0,0,0,0.25)] flex flex-col">
        <div class="flex justify-end">
          <button class="cursor-pointer flex" aria-label="Close">
            <svg
            class="justify-center text-[#E64A19] hover:text-[rgba(230,74,25,1)]"
            xmlns="http://www.w3.org/2000/svg"
            alt="close icon"
            width="12.51"
            height="12.51"
            viewBox="0 0 13 13"
            fill="currentColor">
            <path
              d="M12.1357 2.13574C12.624 1.64746 12.624 0.854492 12.1357 0.366211C11.6475 -0.12207 10.8545 -0.12207 10.3662 0.366211L6.25293 4.4834L2.13574 0.370117C1.64746 -0.118164 0.854492 -0.118164 0.366211 0.370117C-0.12207 0.858398 -0.12207 1.65137 0.366211 2.13965L4.4834 6.25293L0.370117 10.3701C-0.118164 10.8584 -0.118164 11.6514 0.370117 12.1396C0.858399 12.6279 1.65137 12.6279 2.13965 12.1396L6.25293 8.02246L10.3701 12.1357C10.8584 12.624 11.6514 12.624 12.1396 12.1357C12.6279 11.6475 12.6279 10.8545 12.1396 10.3662L8.02246 6.25293L12.1357 2.13574Z"/>
          </svg>
          </button>
        </div>

        <div class="flex items-center gap-2">
          <img src="../public/icons/Vector.jpg"
               alt="error icon"
               class="w-8 h-8 md:w-7.5 md:h-7.5">
          <h2 class="text-Poppins text-[#C62828] font-[700] tracking-[0.125rem] text-[1.5rem] md:text-[2rem]">
            Failed Log In!
          </h2>
        </div>
        <p class="text-left text-4 h-8 mt-3 text-roboto text-[#C62828] font-[400] tracking-[0.5px]">
          Wrong password or email address!
        </p>
      </div>
    </section>

    <footer></footer>
  </body>
</html>
