<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Mikkel August Andaas" />
    <meta
      name="description"
      content="The Log In page for Edugate. Edugate is a result management system for high schools in Nigeria." />
    <link rel="stylesheet" href="../dist/output.css" />
    <script src="" defer></script>
    <title>Edugate | Log In</title>
  </head>
  <body class="bg-neutral-light-gray font-Roboto">
    <header class="h-16 md:h-36 md:mb-30">
      <nav class="flex items-center justify-end">
        <img
          src="../public/img/logo-header.png"
          alt="header logo for Edugate."
          class="mr-auto h-16 w-16 md:h-44 md:w-44 md:ml-12" />

        <button class="pr-4 md:hidden">
          <img
            src="../public/icons/hamburger-menu.png"
            alt="a hamburger icon used for menu" />
        </button>

        <ul class="hidden md:flex font-Poppins font-medium ml-auto gap-8">
          <li>
            <a
              href="../templates/about.html"
              class="py-8 md:px-8 tracking-[0.5px]">
              About</a
            >
          </li>
          <li>
            <a
              href="../templates/contact.html"
              class="py-8 md:px-8 md:mr-20 tracking-[0.5px]">
              Contact</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="w-full max-w-sm sm:max-w-md mx-auto px-4 sm:px-0">
        <form
          class="bg-neutral-light-gray border-0 sm:border-3 sm:border-[#cccccc] shadow-none sm:inset-shadow-sm sm:inset-shadow-[#cccccc] px-10 sm:px-12 pt-6 sm:pt-8 pb-8 sm:pb-10 mb-4 md:w-118 md:h-124"
          action="submit-form-here"
          method="post">
          <h1
            class="text-neutral-dark-gray text-center font-Poppins text-[2rem] font-bold tracking-[0.16px] md:mb-12 sm:mb-4">
            Log in
          </h1>
          <div class="mb-6">
            <label
              class="block text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-[0.5px]"
              for="email"
              >Email</label
            >
            <input
              class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base tracking-[0.5px] placeholder:text-[rgba(51,51,51,0.80)] md:mt-4"
              type="email"
              name="email"
              id="email"
              placeholder="example@mail.com"
              required
              autocomplete="email"
              inputmode="email" />
          </div>
          <div class="mb-6">
            <label
              class="block text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-[0.5px] placeholder:text-[rgba(51,51,51,0.80)]"
              for="password"
              >Password</label
            >
            <input
              class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-dark-medium-gray text-sm sm:text-base tracking-[0.5px] placeholder:text-[rgba(51,51,51,0.80)] md:mt-4"
              type="password"
              name="password"
              id="password"
              placeholder="Enter password"
              required
              autocomplete="current-password" />
          </div>
          <p
            class="mt-6 text-center text-[1rem] sm:text-base font-normal text-black font-Roboto">
            Forgot your password?
            <a class="font-bold hover:cursor-pointer" href="#"><span class="font-normal cursor-default">Click </span>here</a>
          </p>
            <div class="flex m-auto text-center mb-4 md:mt-6 md:w-35">
              <button type="submit" class="primary-button primary-button:hover">
                Submit
              </button>
            </div> 
        </form>
      </div>
    </main>

    <section class="relative flex top-[86px] left-[57px] ">
      <div class="relative bg-[rgb(241,255,235)] w-[337px] h-[114px] max-w-[393px] pt-[16px] pr-[8px] pb-[16px] pl-[8px] shadow-[-2px_4px_4px_2px_rgba(0,0,0,0.25)]">
        <img src="../public/icons/Close.png" alt="Close icon" class="absolute top-[8px] right-[8px] w-[15px] h-[20px] cursor-pointer">
        <div class="flex flex-col gap-[8px] w-[321px]">
          <div class="flex flex-row items-center gap-[8px]">
            <img src="../public/icons/Verified.png" 
                 alt="Verified icon" 
                 class="w-8 h-8 md:w-[30.55px] md:h-[32px]">
            <h2 class="text-Poppins text-[#388E3C] font-[700] tracking-[0.5px] text-[1.5rem] md:text-[2rem]">
              Success!
            </h2>
          </div>
          <p class="text-left text-[1rem] text-roboto text-[#388E3C] font-[400] tracking-[0.5px]">
            Please check your email for instructions on how to verify your account.
          </p>
        </div>
      </div>
    </section>

    <footer class="flex justify-center">
      <img
        src="../public/img/circle-footer.png"
        alt="two colorful circles where one is blue and one is green"
        class="mt-20 hidden md:flex" />
      <img
        src="../public/img/Circles_illustration_mobile.png"
        alt="two colorful circles where one is blue and one is green"
        class="md:hidden flex ml-auto -mt-8" />
    </footer>
  </body>
</html>
