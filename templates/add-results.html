<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Rebecca Våge Husa" />
    <meta
      name="description"
      content="The add results page for Edugate. Edugate is a result management system for high schools in Nigeria."
    />
    <link rel="stylesheet" href="" />
    <script src="" defer></script>
    <title>Edugate | Add results</title>
</head>
<body>
  <header></header>
  <main>
    <h1>Add results</h1>
    <h2>To add results, upload an excel spreadsheet with this format:</h2>
    <table border="1">
      <thead>
        <tr>
          <th>#</th>
          <th>A</th>
          <th>B</th>
          <th>C</th>
          <th>D</th>
          <th>E</th>
          <th>F</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>school_id</td>
          <td>student_is</td>
          <td>year</td>
          <td>term</td>
          <td>results</td>
          <td>grade</td>
        </tr>
        <tr>
          <td>2</td>
          <td>School ID</td>
          <td>Student ID</td>
          <td>Year og Exam</td>
          <td>Term Number (1-3)</td>
          <td>Number/Number</td>
          <td>Exam grade</td>
        </tr>
        <tr>
          <td>3</td>
          <td>#</td>
          <td>#</td>
          <td>#</td>
          <td>#</td>
          <td>#</td>
          <td>#</td>
        </tr>
        <tr>
          <td>4</td>
          <td>#</td>
          <td>#</td>
          <td>#</td>
          <td>#</td>
          <td>#</td>
          <td>#</td>
        </tr>
      </tbody>
    </table>
    <button type="button" class="upload-button">Upload</button>
    <button type="button" class="back2dashb-button">Back to dashboard</button>
  </main>
  <footer></footer>
</body>
</html>
