<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ingelinn Hallseth" />
    <meta
      name="description"
      content="The Registration page for Edugate. Edugate is a result management system for high schools in Nigeria."
    />
    <link rel="stylesheet" href="../dist/output.css" />
    <script src="" defer></script>

    <title>Edugate | Registration</title>

  </head>

  <body class="bg-neutral-light-gray font-Roboto">
    <header>
      <nav class="flex justify-between items-center py-4">
        <img src="../public/img/logo-header.png" alt="the header logo for EduGate">
        <div class="">
          <a href="about.html" class="font-Poppins font-semibold text-xl font- text-center px-32 py-16">About</a>
          <a href="contact.html" class="font-Poppins font-semibold text-xl text-center px-32 py-16">Contact</a>
        </div>
      </nav>
    </header>

    <main>
      <div class="w-full max-w-sm sm:max-w-md mx-auto mt-6 px-4 sm:px-0">
        <form
          class="bg-neutral-light-gray border-0 sm:border-3 sm:border-[#cccccc] shadow-none sm:inset-shadow-sm sm:inset-shadow-[#cccccc] px-10 sm:px-12 pt-6 sm:pt-8 pb-8 sm:pb-10 mb-4"
          action="submit-form-here"
          method="post"
        >
          <h1
            class="text-2xl sm:text-3xl text-center font-bold font-Poppins text-neutral-dark-gray mt-4 mb-8"
          >
            Registration
          </h1>
          <div class="mb-6">
            <label
              class="block text-neutral-dark-gray text-sm sm:text-base font-bold mb-2"
              for="school"
              >School</label
            >
            <input
              class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base"
              type="text"
              name="school"
              id="school"
              placeholder="Edugate"
              required
            />
          </div>
          <div class="mb-6">
            <label
              class="block text-neutral-dark-gray text-sm sm:text-base font-bold mb-2"
              for="address1"
              >Address line 1</label
            >
            <input
              class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base"
              type="text"
              name="address1"
              id="address1"
              placeholder="Address"
              required
            />
          </div>
          <div class="mb-6">
            <label
              class="block text-neutral-dark-gray text-sm sm:text-base font-bold mb-2"
              for="address2"
              >Address line 2</label
            >
            <input
              class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base"
              type="text"
              name="address2"
              id="address2"
              placeholder="Address"
            />
          </div>
          <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <div class="flex-1">
              <label
                class="block text-neutral-dark-gray text-sm sm:text-base font-bold mb-2"
                for="city"
                >City</label
              >
              <input
                class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base"
                type="text"
                name="city"
                id="city"
                placeholder="Oslo"
                required
              />
            </div>
            <div class="flex-1">
              <label
                class="block text-neutral-dark-gray text-sm sm:text-base font-bold mb-2"
                for="postal-code"
                >Postal Code</label
              >
              <input
                class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base"
                type="text"
                name="postal-code"
                id="postal-code"
                placeholder="0000"
                required
                inputmode="numeric"
              />
            </div>
          </div>
          <div class="text-center mb-4">
            <button type="submit" class="primary-button primary-button:hover">
              Submit
            </button>
          </div>
        </form>
      </div>
    </main>

    <footer class="flex justify-center">
      <img src="../public/img/circle-footer.png" alt="two colorful circles where one is blue and one is green" class="mt-12">
    </footer>

  </body>
</html>
