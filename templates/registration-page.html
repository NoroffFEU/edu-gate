<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ingelinn Hallseth" />
    <meta
      name="description"
      content="The Registration page for Edugate. Edugate is a result management system for high schools in Nigeria."
    />
    <link rel="stylesheet" href="../dist/output.css" />
    <script src="" defer></script>
    <title>Edugate | Registration</title>
  </head>
  <body class="bg-gray-50">
    <header></header>
    <main>
      <div class="w-full max-w-sm sm:max-w-md mx-auto mt-6 px-4 sm:px-0">
        <form
          class="bg-gray-50 border border-gray-300 shadow-inner px-8 sm:px-12 pt-6 sm:pt-8 pb-8 sm:pb-10 mb-4"
          action="submit-form-here"
          method="post"
        >
          <h1
            class="text-2xl sm:text-3xl text-center font-bold text-gray-700 mt-4 mb-8"
          >
            Registration
          </h1>
          <div class="mb-6">
            <label
              class="block text-gray-700 text-sm sm:text-base font-bold mb-2"
              for="school"
              >School</label
            >
            <input
              class="bg-white shadow-inner border border-gray-300 rounded-md focus:border-green-600 focus:ring-0 w-full py-2 px-3 sm:px-4 text-gray-700 text-sm sm:text-base"
              type="text"
              name="school"
              id="school"
              placeholder="Edugate"
              required
            />
          </div>
          <div class="mb-6">
            <label
              class="block text-gray-700 text-sm sm:text-base font-bold mb-2"
              for="address1"
              >Address line 1</label
            >
            <input
              class="bg-white shadow-inner border border-gray-300 rounded-md focus:border-green-600 focus:ring-0 w-full py-2 px-3 sm:px-4 text-gray-700 text-sm sm:text-base"
              type="text"
              name="address1"
              id="address1"
              placeholder="Address"
              required
            />
          </div>
          <div class="mb-6">
            <label
              class="block text-gray-700 text-sm sm:text-base font-bold mb-2"
              for="address2"
              >Address line 2</label
            >
            <input
              class="bg-white shadow-inner border border-gray-300 rounded-md focus:border-green-600 focus:ring-0 w-full py-2 px-3 sm:px-4 text-gray-700 text-sm sm:text-base"
              type="text"
              name="address2"
              id="address2"
              placeholder="Address"
            />
          </div>
          <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <div class="flex-1">
              <label
                class="block text-gray-700 text-sm sm:text-base font-bold mb-2"
                for="city"
                >City</label
              >
              <input
                class="bg-white shadow-inner border border-gray-300 rounded-md focus:border-green-600 focus:ring-0 w-full py-2 px-3 sm:px-4 text-gray-700 text-sm sm:text-base"
                type="text"
                name="city"
                id="city"
                placeholder="Oslo"
                required
              />
            </div>
            <div class="flex-1">
              <label
                class="block text-gray-700 text-sm sm:text-base font-bold mb-2"
                for="postal-code"
                >Postal Code</label
              >
              <input
                class="bg-white shadow-inner border border-gray-300 rounded-md focus:border-green-600 focus:ring-0 w-full py-2 px-3 sm:px-4 text-gray-700 text-sm sm:text-base"
                type="text"
                name="postal-code"
                id="postal-code"
                placeholder="0000"
                required
                inputmode="numeric"
              />
            </div>
          </div>
          <div class="text-center mb-4">
            <button
              type="submit"
              class="bg-green-600 hover:bg-green-700 hover:cursor-pointer text-white text-base sm:text-xl font-semibold sm:font-bold py-2 sm:py-3 px-5 sm:px-8 rounded-md"
            >
              Submit
            </button>
          </div>
        </form>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
