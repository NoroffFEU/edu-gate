<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Merat Rezvany" />
  <meta name="description"
    content="The Registration page for Edugate. Edugate is a result management system for high schools in Nigeria." />
  <link rel="stylesheet" href="../dist/output.css" />
  <script src="" defer></script>

  <title>Edugate | Registration</title>

</head>

<body class="bg-neutral-light-gray font-Roboto">
  <header class="border border-gray-300 h-16 md:h-36">
    <nav class="flex items-center justify-end">
      <img src="../public/img/logo-header.png" alt="header logo for Edugate." class="mr-auto h-16 w-16 md:h-40 md:w-40">

      <button class="pr-4 md:hidden">
        <img src="../public/icons/hamburger-menu.png" alt="a hamburger icon used for menu">
      </button>

      <ul class="hidden md:flex font-Poppins font-medium ml-auto gap-8">
        <li>
          <a href="about.html" class="py-8 md:px-8">
            About</a>
        </li>
        <li>
          <a href="contact.html" class="py-8 md:px-8">
            Contact</a>
        </li>
      </ul>
    </nav>

    <main>
      <div class="w-full max-w-md md:max-w-md mx-auto mt-6 px-4 md:px-0">
        <form
          class="bg-neutral-light-gray border-0 md:border-3 md:border-[#cccccc] shadow-none md:inset-shadow-md md:inset-shadow-[#cccccc] px-10 md:px-12 pt-6 md:pt-8 pb-8 md:pb-10 md:mb-4 -mt-3"
          action="submit-form-here" method="post">
          <h1 class="text-neutral-dark-gray text-center font-Poppins text-[32px] font-bold tracking-wide mb-6 md:mb-4">
            Registration
          </h1>
          <div class="mb-6">
            <label class="block text-neutral-dark-gray font-Roboto text-base md:text-md font-bold tracking-wide mb-6 md:mb0 "
              for="school">School</label>
            <input
              class="bg-white border border-[#cccccc] shadow-[inset_0_4px_4px_rgba(0,0,0,0.3)] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 md:px-4 text-neutral-dark-gray text-md md:text-base placeholder:text-gray-600"
              type="text" name="school" id="school" placeholder="Edugate" required />
          </div>
          <div class="mb-6">
            <label class="block text-neutral-dark-gray font-Roboto text-base md:text-md font-bold tracking-wide mb-6 md:mb0"
              for="address1">Address line 1</label>
            <input
              class="bg-white border border-[#cccccc] shadow-[inset_0_4px_4px_rgba(0,0,0,0.3)] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 md:px-4 text-neutral-dark-gray text-md md:text-base placeholder:text-gray-600"
              type="text" name="address1" id="address1" placeholder="Address" required />
          </div>
          <div class="mb-6">
            <label class="block text-neutral-dark-gray font-Roboto text-base md:text-md font-bold tracking-wide mb-6 md:mb0"
              for="address2">Address line 2</label>
            <input
              class="bg-white border border-[#cccccc] shadow-[inset_0_4px_4px_rgba(0,0,0,0.3)] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 md:px-4 text-neutral-dark-gray text-md md:text-base placeholder:text-gray-600"
              type="text" name="address2" id="address2" placeholder="Address" />
          </div>
          <div class="flex flex-col md:flex-row gap-4 mb-6">
            <div class="flex-1">
              <label class="block text-neutral-dark-gray font-Roboto text-base md:text-md font-bold tracking-wide mb-6 md:mb0"
                for="city">City</label>
              <input
                class="bg-white border border-[#cccccc] shadow-[inset_0_4px_4px_rgba(0,0,0,0.3)] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 md:px-4 text-neutral-dark-gray text-md md:text-base placeholder:text-gray-600"
                type="text" name="city" id="city" placeholder="Oslo" required />
            </div>
            <div class="flex-1">
              <label class="block text-neutral-dark-gray font-Roboto text-base md:text-md font-bold tracking-wide mb-6 md:mb0"
                for="postal-code">Postal Code</label>
              <input
                class="bg-white border border-[#cccccc] shadow-[inset_0_4px_4px_rgba(0,0,0,0.3)] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 md:px-4 text-neutral-dark-gray text-md md:text-base placeholder:text-gray-600"
                type="text" name="postal-code" id="postal-code" placeholder="0000" required inputmode="numeric" />
            </div>
          </div>
          <div class="text-center mb-4 -mt-2">
            <button type="submit" class="primary-button primary-button:hover shadow-[inset_0_4px_4px_rgba(0,0,0,0.2)]">
              Submit
            </button>
          </div>
        </form>
      </div>
    </main>

    <footer class="flex justify-center">
      <img src="../public/img/circle-footer.png" alt="two colorful circles where one is blue and one is green"
        class="mt-12 hidden md:flex">
      <img src="../public/img/Circles_illustration_mobile.png"
        alt="two colorful circles where one is blue and one is green" class="md:hidden flex ml-auto -mt-8  ">
    </footer>

</body>

</html>
