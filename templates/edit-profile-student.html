<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="A page for editing student information" />
		<link rel="stylesheet" href="../dist/output.css">
		<title>Edit Profile - Student</title>
	</head>
	<body>
		<header>
			<!-- to be coded -->
			 <p class="text-primary font-Poppins">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Iure illo iste dignissimos, totam quae amet ea. Dolores sed, saepe amet repellat eum aut, facere ipsam doloremque, quibusdam illum cumque natus.</p>
		</header>

		<main>
			<h1>Edit Profile</h1>

			<div>
				<!-- <p>JB</p>
        this is a placeholder for the profile image avatar  -->
			</div>

			<section>
				<form action="#" method="post">
					<!-- Editable fields -->
					<div>
						<label for="name">Name:</label>
						<input type="text" id="name" name="name" placeholder="Enter your name" />
					</div>
					<div>
						<label for="email">Email:</label>
						<input type="email" id="email" name="email" placeholder="Enter your email" />
					</div>
					<div>
						<label for="dob">Date of Birth:</label>
						<input type="date" id="dob" name="dob" />
					</div>

					<!-- Read-only fields -->
					<div>
						<label for="id">ID</label>
						<input type="text" id="id" name="id" value="1921840" readonly />
					</div>
					<div>
						<label for="gradYear">Graduation Year</label>
						<input type="text" id="gradYear" name="gradYear" value="2020" readonly />
					</div>
					<div>
						<label for="school">School</label>
						<input type="text" id="school" name="school" value="The Academy" readonly />
					</div>

					<!-- Submit button -->
					<div>
						<button type="submit">Update</button>
					</div>
				</form>
			</section>
		</main>

		<footer>
			<!-- to be coded -->
		</footer>
	</body>
</html>
