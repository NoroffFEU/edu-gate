<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Kristina Tønnessen"/>
    <link rel="stylesheet" href="../dist/output.css">
    <title>Contact</title>
</head>
<body>
<header class="bg-neutral-light-gray text-neutral-dark-gray">
    <nav class="max-w-7x1 flex items-center justify-between px-4">
        <img class="pl-5" src="../public/img/logo-header.png" alt="Edugate Logo">

        <!-- Hamburger Menu -->
        <div class="relative md:hidden">
            <!-- Checkbox for Hamburger Toggle -->
            <input
                type="checkbox"
                id="menu-toggle"
                class="hidden peer"
            />
            <!-- Hamburger Icon -->
            <label
                for="menu-toggle"
                class="block cursor-pointer focus:outline-none peer-checked:hidden"
                aria-label="Toggle menu"
            >
                <svg class="w-14 h-14 mr-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
            </label>

            <div
                class="fixed inset-0 bg-white text-neutral-dark-gray z-50 transform translate-x-full peer-checked:translate-x-0 transition-transform duration-300"
            >
                <!-- Close Icon -->
                <label
                    for="menu-toggle"
                    class="absolute top-4 right-4 cursor-pointer focus:outline-none"
                    aria-label="Close menu"
                >
                    <svg class="w-12 h-12 mt-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </label>

                <ul class="flex flex-col items-end justify-start mt-40 h-full gap-10 text-xl mr-8">
                    <li>
                        <a href="#" class="flex items-center gap-5 p-3 border-b-2 border-white hover:border-primary">
                            Login
                            <img class="w-5 h-5" src="../public/icons/login.png" alt="Login Icon">
                        </a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center gap-5 p-3 border-b-2 border-white hover:border-primary">
                            Signup
                            <img class="w-5 h-5" src="../public/icons/signup.png" alt="Signup Icon">
                        </a>
                    </li>
                    <li>
                        <a href="../templates/about.html" class="flex items-center gap-5 p-3 border-b-2 border-white hover:border-primary">
                            About
                            <img class="w-5 h-5" src="../public/icons/about.png" alt="About Icon">
                        </a>
                    </li>
                    <li>
                        <a href="../templates/contact.html" class="flex items-center gap-5 p-3 border-b-2 border-white hover:border-primary">
                            Contact
                            <img class="w-5 h-5" src="../public/icons/contact.png" alt="Contact Icon">
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <ul class="hidden md:flex mr-10 font-Poppins font-medium text-xl">
            <li class="py-8 px-16 border-b-2 border-neutral-light-gray hover:border-primary">
                <a href="../templates/about.html" class="font-heading ">About</a>
            </li>
            <li class="py-8 px-16 border-b-2 border-neutral-light-gray hover:border-primary">
                <a href="../templates/contact.html" class="font-heading ">Contact</a>
            </li>
        </ul>
    </nav>
</header>

<main>
    <section class="mx-14 sm:mx-24 md:mx-60 lg:mx-72 xl:mx-96">
        <h1 class="text-black text-center font-Poppins text-[32px] font-bold tracking-wide sm:mb-12 mt-6 mb-4">Contact</h1>
        <p class="text-neutral-dark-gray font-Roboto sm:text-xl text-sm font-normal tracking-wide mb-4 sm:mb-12 pt-0 pl-10 pr-10 sm:pt-10">If you have any questions or feedback, please use the contact form.</p>
        <p class="text-neutral-dark-gray font-Roboto sm:text-xl text-sm font-normal tracking-wide mb-4 sm:mb-12 pb-0 pl-10 pr-10 sm:pb-10">We would love to hear from you.</p>
    </section>

    <section class="my-2">
        <form action="#" class="mx-4 sm:mx-14 md:mx-40 lg:mx-60 xl:mx-80 sm:mt-20 sm:border-2 border-zinc-300 p-10 sm:px-28 lg:px-40">
            <label class="text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide" for="email">Email
                <input id="email" type="email" name="Email" placeholder="example@gmail.com" required class="w-full mb-8 p-2 border-2 border-zinc-300 focus:border-primary rounded shadow-inner shadow-gray-600 mt-1 font-thin">
            </label>
            <label class="text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide" for="name">Name
                <input id="name" type="text" name="Name" placeholder="Ola" required class="w-full mb-8 p-2 border-2 border-zinc-300 focus:border-primary rounded shadow-inner shadow-gray-600 mt-1 font-thin">
            </label>
            <label class="text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide" for="surname">Surname
                <input id="surname" type="text" name="Surname" placeholder="Nordmann" required class="w-full mb-8 p-2 border-2 border-zinc-300 focus:border-primary rounded shadow-inner shadow-gray-600 mt-1 font-thin">
            </label>
            <label class="text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide" for="message">Message</label>
                <textarea id="message" type="message" name="Message" maxlength="2000" placeholder="Your message.." required class="w-full p-2 min-h-40 border-2 border-zinc-300 rounded shadow-inner shadow-gray-600 focus:border-primary mt-1 font-thin"></textarea> 

            <div class="flex justify-center">
                <button class="primary-button mt-10" type="submit">
                Submit
                </button>
            </div>

        </form>
    </section>
</main>

<footer class="flex justify-end sm:justify-center">
    <img class="sm:hidden" src="../public/img/Circles_illustration_mobile.png" alt="Edugate footer circles">
    <img class="hidden sm:block shrink-0 mx-4 mt-8" src="../public/img/circle-footer.png" alt="Edugate footer circles">
</footer>
</body>
</html>
