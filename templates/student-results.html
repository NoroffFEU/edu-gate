<!DOCTYPE html>
<html lang="en">
	<head>

        <meta lang="en">
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Student Results</title>
		<meta name="description" content="" />
		<link href="../" rel="stylesheet" />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Roboto:wght@400;700&display=swap"
			rel="stylesheet"
		/>
		<script

	<body class="w-full bg-neutral-light-gray p-5">
		<header></header>

        <main class="flex flex-col w-full font-Roboto self-center px-8 gap-5 pb-8">
            <div class="text-neutral-medium-gray flex h-10 items-center mt-5 gap-6 text-xs sm:text-base pl-5">
                <a href="#">Dashboard</a>&gt;
                <p class="text-primary">Select student</p>
            </div>

            <div class="flex flex-col gap-5 items-center">
                <div class="flex flex-row w-full justify-center">
                    <img src="../public/icons/green-double-arrows-right.png" alt="arrows" class="w-12 h-12 md:hidden">
                    <h1 class="w-fit font-bold text-2xl font-Poppins">Select Student</h1>    
                </div>
                
            
                <p class="w-fit text-sm">Select student to view results</p>

                <img src="../public/icons/results.png" class="w-10 sm:w-15 md:hidden">

            <div class="flex flex-row items-center justify-center w-full h-12">
                <input class="w-55 sm:w-72 h-10 p-2 rounded-l-md text-neutral-medium-gray border border-[#CCCCCC] text-xs sm:text-sm" type="text" placeholder="Search for student...">
                <i class="fa-solid fa-magnifying-glass border h-10 w-10 text-center py-2.5 
                rounded-r-md text-primary hover:bg-primary-hover hover:text-white"></i>
            </div>
        </div>

		<footer></footer>
