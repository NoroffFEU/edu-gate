	<main class="mb-10 mx-6">
		<div class="flex mb-10 gap-4 font-light text-neutral-medium-gray">
			<a src="../../templates/students/dashboard-student.html">
				Dashboard</a>
			<p>></p>
			<a src="../../templates/students/student-profile.html" class="text-primary">
				Profile</a>
		</div>

		<section class="mx-4 md:mx-40 md:p-10 xl:mx-80 lg:border-2 border-neutral-medium-gray">
			<h3
				class="text-neutral-dark-gray text-center font-Poppins text-[2rem] font-bold tracking-wide mb-12 sm:mb-4">
				Edit Profile</h3>
			<h1
				class="hidden text-neutral-dark-gray text-center font-Poppins text-[2rem] font-bold tracking-wide mb-12 sm:mb-4">
				Edit Profile</h1>
			<div class="flex justify-center">
				<img class="w-18.5 h-18.5 md:w-28 md:h-28" src="../../public/icons/user-circle-edit-mobile.png"
					alt="user profile icon and initials">
			</div>
			<section class="">
				<form action="#" class="w-full lg:px-40">
					<!-- Editable fields -->
					<label class="text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide">Name:
						<input type="text" name="Name" placeholder="Ola" required aria-label="nameinput field"
							class="w-full mb-4 p-2 border-2 border-zinc-300 focus:border-primary rounded shadow-inner shadow-gray-600 mt-1 font-thin">
					</label>
					<label class="text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
						for="email">Email:
						<input id="email" type="email" name="Email" placeholder="example@gmail.com" required aria-label="email input field"
							class="w-full mb-4 p-2 border-2 border-zinc-300 focus:border-primary rounded shadow-inner shadow-gray-600 mt-1 font-thin">
					</label>
					<label class="text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
						for="dob">Date of Birth:
						<input type="date" id="dob" name="dob" required aria-label="Date of birth input field"
							class="w-full mb-4 p-2 border-2 border-zinc-300 focus:border-primary rounded shadow-inner shadow-gray-600 mt-1 font-thin">
					</label>
					<!-- Read-only fields -->
					<div>
						<label class="text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
							for="id">ID:</label>
						<input type="text" id="id" name="id" value="1921840" readonly aria-label="Read-only ID field"
							class="w-full mb-4 p-2 border-2 border-zinc-300 bg-zinc-300 text-neutral-medium-gray rounded shadow-inner shadow-gray-600 mt-1 font-thin" />
					</div>
					<div>
						<label class="text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
							for="gradYear">Graduation Year:</label>
						<input type="text" id="gradYear" name="gradYear" value="2020" readonly aria-label="Read-only graduation year field"
							class="w-full mb-4 p-2 border-2 border-zinc-300 bg-zinc-300 text-neutral-medium-gray rounded shadow-inner shadow-gray-600 mt-1 font-thin" />
					</div>
					<div>
						<label class="text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
							for="school">School:</label>
						<input type="text" id="school" name="school" value="The Academy" readonly aria-label="Read-only school name field"
							class="w-full mb-4 p-2 border-2 border-zinc-300 bg-zinc-300 text-neutral-medium-gray rounded shadow-inner shadow-gray-600 mt-1 font-thin" />
					</div>
					<div class="flex justify-center">
						<button class="border-2 hover:bg-[#388e3c] hover:border-[#388e3c] md:hover:border-[#4CAF50] md:hover:bg-[#4CAF50] border-[#4CAF50] bg-[#4CAF50] text-[#FFFFFF] font-Poppins font-semibold text-[1.625rem] text-center tracking-[0.5px] items-center justify-center flex m-auto h-14.5 w-37.5 rounded-md">Update</button>
					</div>
				</form>
			</section>
		</section>
	</main>

	<footer class="flex justify-end sm:justify-center">
