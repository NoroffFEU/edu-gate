<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../dist/output.css">
    <title>headers</title>
</head>
<body class="bg-neutral-light-gray">

    <!-- not logged in -->

    <header class="bg-neutral-light-gray text-neutral-dark-gray">
        <nav class="max-w-7x1 flex items-center justify-between px-4 py-4">
            <img class="pl-5" src="../public/img/logo-header.png" alt="Edugate Logo">
    
            <!-- Hamburger Menu -->
            <div class="relative md:hidden">
                <!-- Checkbox for Hamburger Toggle -->
                <input
                    type="checkbox"
                    id="menu-toggle"
                    class="hidden peer"
                />
                <!-- Hamburger Icon -->
                <label
                    for="menu-toggle"
                    class="block cursor-pointer focus:outline-none peer-checked:hidden"
                    aria-label="Toggle menu"
                >
                    <svg class="w-14 h-14 mr-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </label>
    
                <div
                    class="fixed inset-0 bg-white text-neutral-dark-gray z-50 transform translate-x-full peer-checked:translate-x-0 transition-transform duration-300"
                >
                    <!-- Close Icon -->
                    <label
                        for="menu-toggle"
                        class="absolute top-4 right-4 cursor-pointer focus:outline-none"
                        aria-label="Close menu"
                    >
                        <svg class="w-12 h-12 mt-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </label>
    
                    <ul class="flex flex-col items-end justify-start mt-40 h-full gap-16 text-xl mr-8">
                        <li>
                            <a href="#" class="flex items-center gap-5 hover:underline">
                                Login
                                <img class="w-5 h-5" src="../public/icons/login.png" alt="Login Icon">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center gap-5 hover:underline">
                                Signup
                                <img class="w-5 h-5" src="../public/icons/signup.png" alt="Signup Icon">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center gap-5 hover:underline">
                                About
                                <img class="w-5 h-5" src="../public/icons/about.png" alt="About Icon">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center gap-5 hover:underline">
                                Contact
                                <img class="w-5 h-5" src="../public/icons/contact.png" alt="Contact Icon">
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
    
            <ul class="hidden md:flex gap-16 mr-32">
                <li><a href="#" class="font-heading hover:underline">About</a></li>
                <li><a href="#" class="font-heading hover:underline">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Student -->

    <header class="bg-neutral-light-gray text-neutral-dark-gray">
        <nav class="max-w-7x1 flex items-center justify-between px-4">
            <img class="pl-5" src="../public/img/logo-header.png" alt="Edugate Logo">
    
            <!-- Hamburger Menu -->
            <div class="relative md:hidden">
                <!-- Checkbox for Hamburger Toggle -->
                <input
                    type="checkbox"
                    id="menu-toggle"
                    class="hidden peer"
                />
                <!-- Hamburger Icon -->
                <label
                    for="menu-toggle"
                    class="block cursor-pointer focus:outline-none peer-checked:hidden"
                    aria-label="Toggle menu"
                >
                    <svg class="w-14 h-14 mr-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </label>
    

                <div
                    class="fixed inset-0 bg-white text-neutral-dark-gray z-50 transform translate-x-full peer-checked:translate-x-0 transition-transform duration-300"
                >
                    <!-- Close Icon -->
                    <label
                        for="menu-toggle"
                        class="absolute top-4 right-4 cursor-pointer focus:outline-none"
                        aria-label="Close menu"
                    >
                        <svg class="w-12 h-12 mt-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </label>
    

                    <ul class="flex flex-col items-end justify-start mt-40 h-full gap-16 text-xl mr-8">
                        <li>
                            <a href="#" class="flex items-center gap-5 hover:underline">
                                Dashboard
                                <img class="w-5 h-5" src="../public/icons/dashboard.png" alt="Dashboard Icon">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center gap-5 hover:underline">
                                Profile
                                <img class="w-5 h-5" src="../public/icons/user-circle.png" alt="Profile Icon">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center gap-5 hover:underline">
                                About
                                <img class="w-5 h-5" src="../public/icons/about.png" alt="About Icon">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center gap-5 hover:underline">
                                Contact
                                <img class="w-5 h-5" src="../public/icons/contact.png" alt="Contact Icon">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center mt-20 gap-5 hover:underline">
                                Log out
                                <img class="w-5 h-5" src="../public/icons/logout.png" alt="Log out Icon">
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
    
            <!-- add green hover underline specific for each page -->
            <ul class="hidden md:flex gap-16">
                <li><a href="#" class="font-heading hover:underline">Dashboard</a></li>
                <li><a href="#" class="font-heading hover:underline">About</a></li>
                <li><a href="#" class="font-heading hover:underline">Contact</a></li>
            </ul>
            <!-- User Dropdown -->
            <div class="relative">
                <!-- Hidden Checkbox -->
                <input type="checkbox" id="dropdown-toggle" class="hidden peer">

                <!-- User Icon (Clickable) -->
                <label
                    for="dropdown-toggle"
                    class="hidden md:flex w-14 h-14 mr-10 cursor-pointer"
                >
                    <img src="/public/icons/user-circle.png" alt="User dropdown">
                </label>

                <!-- Dropdown Menu -->
                <ul
                    class="absolute right-0 mt-2 mr-8 w-40 text-center border border-neutral-light-gray rounded-lg shadow-lg opacity-0 invisible peer-checked:opacity-100 peer-checked:visible transition-opacity duration-200">
                    <li>
                        <a href="#" class="block px-8 py-4 hover:bg-neutral-light-gray hover:text-green-600">See results</a>
                    </li>
                    <li>
                        <a href="#" class="block px-8 py-4 hover:bg-neutral-light-gray border-y-2 hover:text-green-600">Profile</a>
                    </li>
                    <li>
                        <a href="#" class="block px-8 py-4 hover:bg-neutral-light-gray hover:text-red-600">Log out</a>
                    </li>
                </ul>
            </div>
        </nav>

    </header>

 

</body>
