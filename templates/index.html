<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Landing page Edugate</title>
</head>
<body class="bg-neutral-light-gray">
    <header class="bg-neutral-light-gray text-neutral-dark-gray p-4">
        <nav class="max-w-7x1 mx-auto flex justify-between">
          <img src="../public/img/logo-header.png" alt="logo">
          <ul class="flex gap-4">
            <li><a href="#" class="font-heading hover:underline">About</a></li>
            <li><a href="#" class="font-heading hover:underline">Contact</a></li>
          </ul>
        </nav>
    </header>
    <main class="bg-neutral-light-gray">
        <section>
            <img src="../public/img/heroimage-edugate.png" alt="">

            <h1 class=" text-neutral-dark-gray text-2xl font-bold font-heading p-4 mb-4">Edugate</h1>
            <h2>Welcome to Edugate, the platform that lets you access your exam results online</h2>
            <section class="px-64 -mt-40">
                <button class="bg-primary w-24 rounded-md text-neutral-light-gray">Sign up</button>
                <button class="border-b-secondary w-24 rounded-md text-secondary font-semibold">Log in</button>
            </section>

            <div id="app" class="bg-white p-6 rounded-lg shadow-lg w-96">
                <h1 class="text-2xl font-bold mb-4">To-Do List</h1>
                <input id="todoInput" type="text" placeholder="Add a task" 
                       class="w-full p-2 border rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <button id="addTodo" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Add Task
                </button>
                <ul id="todoList" class="mt-4 space-y-2"></ul>
            </div>
        </section>
   
    </main>
    <footer>
        <img src="../public/img/circle-footer.png" alt="">
    </footer>
</body>
</html>
