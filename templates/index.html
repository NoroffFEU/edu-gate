<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../dist/output.css">
    <title>Landing page Edugate</title>
</head>
<body class="bg-neutral-light-gray">
    <header class="bg-neutral-light-gray text-neutral-dark-gray p-4 mb-[61px]">
        <nav class="max-w-7x1 mx-auto flex items-center justify-between">
          <img src="../public/img/logo-header.png" alt="logo">
          <ul class="flex gap-[100px] text-[20px] mr-[100px] font-semibold">
            <li class="relative group">
                <a href="#" class="font-heading px-10">About</a>
                <span class="absolute left-0 bottom-0 tansform translate-y-[2px] w-0 h-[2px] bg-primary transition-all duration-300 group-hover:w-full"></span>
            </li>
            <li class="relative group px-10">
                <a href="#" class="font-heading">Contact</a>
                <span class="absolute left-0 bottom-0 tansform translate-y-[2px] w-0 h-[2px] bg-primary transition-all duration-300 group-hover:w-full"></span>
            </li>
          </ul>
        </nav>
    </header>
    <main class="bg-neutral-light-gray">
        <section class="relative">
            <img src="../public/img/heroimage-edugate.png" alt="">
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
            <h1 class="text-neutral-dark-gray text-[32px] font-bold font-heading absolute top-[50px]">Edugate</h1>
            <h2 class="text-[16px] font-medium absolute top-[100px]">Welcome to Edugate, the platform that lets you access your exam results online</h2>
            <div class="flex gap-6 mt-4 absolute bottom-[60px]">
                <button class="bg-primary h-[59px] w-[133px] rounded-md text-neutral-light-gray text-[26px] font-bold flex items-center justify-center hover:bg-primary-hover">Sign up</button>
                <button class="box-border border-2 border-secondary w-[119px] rounded-md text-secondary text-[26px] font-bold flex items-center justify-center hover:bg-secondary-hover">Log in</button>
            </div>
            </div>
        </section>
   </main>
    <footer class="p-4 ml-10 mr-10">
        <img src="../public/img/circle-footer.png" alt="">
    </footer>
</body>
</html>
