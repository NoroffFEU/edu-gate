<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ingelinn Hallseth" />
    <meta
      name="description"
      content="The Sign Up page for Edugate. Edugate is a result management system for high schools in Nigeria."
    />
    <link rel="stylesheet" href="../dist/output.css" />
    <script src="" defer></script>
    <title>Edugate | Sign Up</title>
  </head>
  <body class="bg-neutral-light-gray font-Roboto">
    <header></header>
    <main>
      <div class="w-full max-w-sm sm:max-w-md mx-auto mt-6 px-4 sm:px-0">
        <form
          class="bg-neutral-light-gray border-0 sm:border-3 sm:border-[#cccccc] shadow-none sm:inset-shadow-sm sm:inset-shadow-[#cccccc] px-10 sm:px-12 pt-6 sm:pt-8 pb-8 sm:pb-10 mb-4"
          action="submit-form-here"
          method="post"
        >
          <h1 class="text-neutral-dark-gray text-center font-Poppins text-[32px] font-bold tracking-wide mb-12 sm:mb-4">Sign Up</h1>
          <div class="mb-6">
            <label
            class="block text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
              for="email"
              >Email</label
            >
            <input
              class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base"
              type="email"
              name="email"
              id="email"
              placeholder="example@mail.com"
              required
            />
          </div>
          <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <div class="flex-1">
              <label
                class="block text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
                for="firstname"
                >First name</label
              >
              <input
                class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base"
                type="text"
                name="firstname"
                id="firstname"
                placeholder="Ola"
                required
              />
            </div>
            <div class="flex-1">
              <label
                class="block text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
                for="surname"
                >Surname</label
              >
              <input
                class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base"
                type="text"
                name="surname"
                id="surname"
                placeholder="Nordmann"
                required
              />
            </div>
          </div>
          <div class="mb-6">
            <label
              class="block text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
              for="password"
              >Password</label
            >
            <input
              class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base"
              type="password"
              name="password"
              id="password"
              placeholder="Choose password"
              required
              autocomplete="new-password"
              minlength="8"
              pattern=".{8,}"
            />
          </div>
          <div class="mb-6">
            <label
              class="block text-neutral-dark-gray font-Roboto text-base sm:text-sm font-bold tracking-wide"
              for="confirm-password"
              >Confirm password</label
            >
            <input
              class="bg-white border border-[#cccccc] inset-shadow-sm inset-shadow-[#cccccc] rounded-md focus:border-primary focus:ring-0 w-full py-2 px-3 sm:px-4 text-neutral-dark-gray text-sm sm:text-base"
              type="password"
              name="confirm-password"
              id="confirm-password"
              placeholder="Repeat password"
              required
              autocomplete="new-password"
              minlength="8"
              pattern=".{8,}"
            />
          </div>
          <div class="text-center mb-4">
            <button type="submit" class="primary-button primary-button:hover">
              Submit
            </button>
          </div>
        </form>
      </div>
    </main>
    <footer></footer>

    <section class="flex flex-col items-center hidden">
      <div class="bg-[rgb(255,235,238)] h-42 w-112 border-none shadow-[-2px_4px_4px_2px_rgba(0,0,0,0.25)] items-center text-center">
          <img src="../public/icons/x-red.png" alt="an icon of a red x, clicked to close the alert." class="ml-auto pr-4 pt-4">
          <div class="text-center, items-center justify-center flex flex-col">
            <h2 class="text-[2rem] text-Poppins text-[#C62828] font-[700] tracking-[0.5px]">Failed Sign Up!</h2>
            <img src="../public/icons/vector.png" alt="a circle with an exclamation mark inside. a vector" class="mr-84 -mt-10 mb-8 h-20 w-20">
          <p class="text-[1rem] text-roboto text-[#C62828] font-[400] tracking-[0.5px] -mt-18 ml-10">Wrong password or email address!</p>
        </div>

      </div>
    </section>
  </body>
</html>
