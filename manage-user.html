<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage User</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex">
  <aside class="fixed left-0 top-0 h-full bg-white shadow-lg z-10 border-r-2 border-gray-500 border-opacity-50">
    <nav class="h-full flex flex-col justify-center">
      <ul class="space-y-8 p-4">
        <li><img src="home.svg" alt="Home"></li>
        <li><img src="book.png" alt="Book logo"></li>
        <li><img src="user.png" alt="User logo"></li>
        <li><img src="student.png" alt="Student logo"></li>
        <li><img src="logout.png" alt="Logout"></li>
      </ul>
    </nav>
  </aside>
  <div class="flex-1 ml-20 flex flex-col min-h-screen"> <!-- Added flex and min-h-screen -->


    <header class="flex flex-row justify-between items-center p-4 border-b-2 border-gray-500 border-opacity-50">
      <img src="edugate-logo.png" alt="Edugate logo">
      <nav>
        <ul class="flex items-center space-x-6">
          <li>Dashboard</li>
          <li>About</li>
          <li>Contact</li>
          <li><img src="user-circle.svg" alt="Profile button"></li>
        </ul>
      </nav>
    </header>

    <main class="flex flex-col items-center px-4 flex-grow"> <!-- Added flex-grow -->
      <p class="self-start mb-12">
        Dashboard > Select user > <span class="text-[#4CAF50]">Manage user</span>
      </p>
      <div class="w-full max-w-2xl">
        <h2 class="text-2xl font-bold text-center mb-2">Manage User</h2>
        <p class="text-center mb-8">Edit the user info below</p>
        <form action="" class="space-y-6">
          <div class="space-y-4">
            <label class="block font-medium">
              ID:
              <input type="text" name="id" placeholder="1921840" class="w-full p-2 border rounded mt-1">
            </label>

            <label class="block font-medium">
              First name:
              <input type="text" name="first-name" placeholder="Joe" class="w-full p-2 border rounded mt-1">
            </label>

            <label class="block font-medium">
              Last name:
              <input type="text" name="last-name" placeholder="Bloggs" class="w-full p-2 border rounded mt-1">
            </label>

            <label class="block font-medium">
              Position:
              <input type="text" name="position" placeholder="Teacher" class="w-full p-2 border rounded mt-1">
            </label>

            <label class="block font-medium">
              Date of Birth:
              <input type="date" name="dob" class="w-full p-2 border rounded mt-1">
            </label>

            <label class="block font-medium">
              Email:
              <input type="email" name="email" placeholder="joeblog2020@edugate.no"
                class="w-full p-2 border rounded mt-1">
            </label>

            <label class="block font-medium">
              School:
              <input type="text" name="school" placeholder="The Academy" class="w-full p-2 border rounded mt-1">
            </label>
          </div>
        </form>
      </div>
      <div class="mt-8 space-x-4">
        <button class="bg-[#4CAF50] text-white px-6 py-2 rounded hover:bg-[#45a049]">Update</button>
        <button class="bg-[#FF5722] text-white px-6 py-2 rounded hover:bg-[#f4511e]">Delete user</button>
      </div>
    </main>
    <footer class="mt-20 flex justify-center p-4">
      <img src="circles.png" alt="Circles" class="w-auto">
    </footer>
  </div>
</body>

</html>
